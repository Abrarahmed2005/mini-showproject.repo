<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe website</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Headland+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="images-section">
            <aside>
                <img src="images/side_image1.png" alt="">
                <img src="images/side_image2.png" alt="">
                <img src="images/side_image3.png" alt="">
                <img src="images/side_image4.png" alt="">
                <img src="images/side_image5.png" alt="">
                <img src="images/side_image6.png" alt="">
 
            </aside>
            <section class="image-container">
                <img src="images/center_image.png" alt="">
            </section>
        </section>
        <section class="content">
            <div class="content-header">
                <p class="green-text">Sustainable materials</p>
                <h1>NIke Revolution 8</h1>
                <h4>Men's Road Running Shoes</h4>
            </div>
            <section class="price-section">
                <h2>MRP $00.0</h2>
                <div>
                    <p>Inclusive of all taxes</p>
                    <p>Also includes all aplicable duties</p>
                </div>
            </section>

            <section class="variants-section">
                <img src="images/variant1.png" alt="variant1">
                <img src="images/variant2.png" alt="variant2">
                <img src="images/variant3.png" alt="variant3">
                <img src="images/variant4.png" alt="variant4">
            </section>

            <section class="sizes">
                <div class="size">UK 6</div>
                <div class="size">UK 6.5</div>
                <div class="size">UK 7</div>
                <div class="size">UK 7.5</div>
            </section>

            <section class="button-container">
                <button class="add_to_bag">Add to Bag</button>
                <button class="">Wishlist</button>
            </section>
        </section>
    </main>
</body>
</html>
